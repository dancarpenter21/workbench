[project]
name = "workbench-ros-tooling"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "catkin-pkg>=1,<2",
  "colcon-common-extensions>=0.3,<1",
  "empy>=4,<5",
  "filelock>=4.2.4",
  "jinja2>=3,<4",
  "lark>=1,<2",
  "numpy<2.4",
  "osrf-pycommon>=2.0.2",
  "pybind11>=2.13,<4",
  "pyyaml>=6,<7",
  "rosdep>=0.25,<1",
  "rosinstall-generator>=0.1,<1",
  "setuptools>=80,<81",
  "typeguard>=4,<5",
  "vcstool>=0.3,<1",
  "xacro>=2.0,<3",
]

# Separate lockfile: resolving ROS build tools must not rebuild local AI models.
[tool.uv.workspace]
members = []
