# Five arm axes cannot independently satisfy an arbitrary six-dimensional pose.
# Position-only IK is for exploratory mock planning, not qualified grasp orientation.
arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.1
  position_only_ik: true
