<svg xmlns="http://www.w3.org/2000/svg" style="color:#e7edf5;background:#20252c;font-family:Arial,sans-serif" class="measurement-diagram" viewBox="0 0 560 270" role="img" aria-label="Right handed axes: X along reach, Y left, Z up. Positive roll turns Y toward Z; positive pitch turns Z toward X; positive yaw turns X toward Y.">
    <g fill="none" stroke="currentColor" stroke-width="2">
    <path d="M90 200H280 M90 200V45 M90 200L30 245"/><path d="m270 194 10 6-10 6 M84 55l6-10 6 10 M42 240l-12 5 5-12"/>
    <text x="285" y="205" fill="currentColor" stroke="none" font-size="15">+X reach</text><text x="75" y="35" fill="currentColor" stroke="none" font-size="15">+Z up</text><text x="8" y="265" fill="currentColor" stroke="none" font-size="15">+Y left</text>
    <text x="320" y="65" fill="currentColor" stroke="none" font-size="15">Roll about +X: Y → Z</text><text x="320" y="110" fill="currentColor" stroke="none" font-size="15">Pitch about +Y: Z → X</text><text x="320" y="155" fill="currentColor" stroke="none" font-size="15">Yaw about +Z: X → Y</text><text x="310" y="220" fill="currentColor" stroke="none" font-size="15">Right thumb along +axis;</text><text x="310" y="244" fill="currentColor" stroke="none" font-size="15">curled fingers turn positive.</text></g></svg>
