<svg xmlns="http://www.w3.org/2000/svg" style="color:#e7edf5;background:#20252c;font-family:Arial,sans-serif" class="measurement-diagram" viewBox="0 0 560 270" role="img" aria-label="Right-handed axes viewed from the robot's right side: positive X points right along reach, positive Z points up, and positive Y points left into the page, shown by a circled cross. X cross Y equals Z. Positive roll turns Y toward Z; positive pitch turns Z toward X; positive yaw turns X toward Y.">
    <g fill="none" stroke="currentColor" stroke-width="2">
    <path d="M75 190H245 M65 180V45"/><path d="m235 184 10 6-10 6 M59 55l6-10 6 10"/>
    <circle cx="65" cy="190" r="10"/><path d="m60 185 10 10 m-10 0 10-10"/>
    <text x="200" y="214" fill="currentColor" stroke="none" font-size="15">+X reach</text><text x="45" y="35" fill="currentColor" stroke="none" font-size="15">+Z up</text><text x="20" y="232" fill="currentColor" stroke="none" font-size="15">+Y left (into page)</text><text x="20" y="257" fill="currentColor" stroke="none" font-size="14">Side view from −Y</text>
    <text x="320" y="65" fill="currentColor" stroke="none" font-size="15">Roll about +X: Y → Z</text><text x="320" y="110" fill="currentColor" stroke="none" font-size="15">Pitch about +Y: Z → X</text><text x="320" y="155" fill="currentColor" stroke="none" font-size="15">Yaw about +Z: X → Y</text><text x="320" y="190" fill="currentColor" stroke="none" font-size="15">+X × +Y = +Z</text><text x="310" y="220" fill="currentColor" stroke="none" font-size="15">Right thumb along +axis;</text><text x="310" y="244" fill="currentColor" stroke="none" font-size="15">curled fingers turn positive.</text></g></svg>
