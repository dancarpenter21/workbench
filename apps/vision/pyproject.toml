[project]
name = "workbench-vision"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["workbench-common", "workbench-contracts"]
[project.optional-dependencies]
hardware = ["opencv-python-headless>=4.10,<5", "numpy>=1.26,<2.4"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
